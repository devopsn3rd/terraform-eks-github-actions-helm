<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect width="1000" height="820" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">orders-api — CI/CD to Amazon EKS</text>

  <!-- Developer -->
  <rect x="410" y="56" width="180" height="44" rx="8" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="500" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Developer</text>

  <line x1="500" y1="100" x2="500" y2="140" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GitHub repo -->
  <rect x="360" y="142" width="280" height="56" rx="8" fill="#24292f"/>
  <text x="500" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GitHub Repository</text>
  <text x="500" y="184" text-anchor="middle" font-size="12" fill="#c9d1d9">orders-api</text>

  <!-- Branch lines to CI and CD -->
  <line x1="420" y1="198" x2="260" y2="246" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="198" x2="740" y2="246" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="222" font-size="11" fill="#57606a">pull request</text>
  <text x="700" y="222" font-size="11" fill="#57606a" text-anchor="end">merge to main</text>

  <!-- CI box -->
  <rect x="90" y="248" width="330" height="158" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="255" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">CI — ci.yml</text>
  <text x="255" y="294" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">on pull request</text>
  <circle cx="118" cy="316" r="3" fill="#24292f"/>
  <text x="130" y="320" font-size="12.5" fill="#1a1a1a">Build image (no push)</text>
  <circle cx="118" cy="340" r="3" fill="#24292f"/>
  <text x="130" y="344" font-size="12.5" fill="#1a1a1a">helm lint</text>
  <circle cx="118" cy="364" r="3" fill="#24292f"/>
  <text x="130" y="368" font-size="12.5" fill="#1a1a1a">helm template</text>
  <text x="255" y="392" text-anchor="middle" font-size="11" fill="#8a8a8a" font-style="italic">Never touches AWS</text>

  <!-- CD box -->
  <rect x="580" y="248" width="330" height="158" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="745" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">CD — cd.yml</text>
  <text x="745" y="294" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">on merge to main</text>
  <text x="608" y="320" font-size="12.5" fill="#1a1a1a">1.  Assume IAM role (OIDC)</text>
  <text x="608" y="344" font-size="12.5" fill="#1a1a1a">2.  Build &amp; push image to ECR</text>
  <text x="608" y="368" font-size="12.5" fill="#1a1a1a">3.  helm upgrade --install</text>
  <text x="745" y="392" text-anchor="middle" font-size="11" fill="#8a8a8a" font-style="italic">Only workflow that reaches AWS</text>

  <!-- Arrow CD -> AWS -->
  <line x1="745" y1="406" x2="745" y2="450" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="755" y="432" font-size="11" fill="#57606a">OIDC auth</text>

  <!-- AWS boundary -->
  <rect x="55" y="452" width="890" height="330" rx="14" fill="none" stroke="#FF9900" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="78" y="480" font-size="13.5" font-weight="700" fill="#232F3E">AWS Account</text>

  <!-- IAM Role -->
  <rect x="610" y="502" width="300" height="78" rx="8" fill="#eef2f7" stroke="#2c3e50" stroke-width="2"/>
  <text x="760" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">IAM Role</text>
  <text x="760" y="542" text-anchor="middle" font-size="11.5" fill="#34495e">github-actions-deploy-role</text>
  <text x="760" y="559" text-anchor="middle" font-size="10.5" fill="#6b7a8c" font-style="italic">trusts GitHub OIDC provider</text>

  <!-- ECR -->
  <rect x="610" y="602" width="300" height="78" rx="8" fill="#eef2f7" stroke="#2c3e50" stroke-width="2"/>
  <text x="760" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">Amazon ECR</text>
  <text x="760" y="649" text-anchor="middle" font-size="11.5" fill="#34495e">orders-api repository</text>

  <!-- VPC nested -->
  <rect x="95" y="498" width="480" height="265" rx="12" fill="none" stroke="#326CE5" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="114" y="522" font-size="12.5" font-weight="700" fill="#1a3e8f">VPC</text>

  <!-- EKS cluster -->
  <rect x="120" y="536" width="430" height="212" rx="10" fill="#f0f5ff" stroke="#326CE5" stroke-width="2"/>
  <text x="140" y="560" font-size="12.5" font-weight="700" fill="#1a3e8f">EKS Cluster — eks-resume-cluster</text>

  <!-- Service -->
  <rect x="150" y="610" width="130" height="62" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="1.5"/>
  <text x="215" y="636" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a3e8f">Service</text>
  <text x="215" y="653" text-anchor="middle" font-size="10.5" fill="#4a6fa5">ClusterIP</text>

  <!-- Pods -->
  <rect x="350" y="594" width="170" height="52" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="1.5"/>
  <text x="435" y="615" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3e8f">Pod</text>
  <text x="435" y="631" text-anchor="middle" font-size="10.5" fill="#4a6fa5">orders-api</text>

  <rect x="350" y="656" width="170" height="52" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="1.5"/>
  <text x="435" y="677" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3e8f">Pod</text>
  <text x="435" y="693" text-anchor="middle" font-size="10.5" fill="#4a6fa5">orders-api</text>

  <!-- Service -> Pods -->
  <line x1="280" y1="628" x2="345" y2="619" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="648" x2="345" y2="679" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="288" y="612" font-size="10" fill="#57606a">routes traffic</text>

  <!-- ECR -> EKS -->
  <line x1="605" y1="648" x2="555" y2="640" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="663" font-size="10.5" fill="#57606a" text-anchor="end">image pull</text>

  <!-- IAM -> EKS -->
  <line x1="605" y1="548" x2="555" y2="555" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="543" font-size="10.5" fill="#57606a" text-anchor="end">RBAC access entry</text>

  <!-- Legend -->
  <text x="78" y="800" font-size="10.5" fill="#8a8a8a">GitHub — grey/dark   ·   AWS IAM &amp; ECR — slate   ·   VPC &amp; EKS — blue   ·   AWS boundary — orange (dashed)</text>
</svg>
