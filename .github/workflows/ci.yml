name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'helm/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build image (no push)
        run: docker build -t orders-api:ci-check .

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'latest'

      - name: Lint the chart
        run: helm lint ./helm/app

      - name: Render the chart (catches template errors)
        run: helm template ./helm/app
